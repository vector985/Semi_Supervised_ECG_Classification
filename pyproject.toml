[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-mixmatch"
version = "0.1.0"
description = "Semi-supervised ECG rhythm classification with MixMatch"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "torch>=2.4"]

[project.scripts]
ecg-mixmatch = "ecg_mixmatch.cli:main"

[tool.setuptools.packages.find]
include = ["ecg_mixmatch*"]
